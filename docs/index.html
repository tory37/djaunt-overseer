<!DOCTYPE html>
<html lang="en" data-dj-theme="hoard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseer — vertical tabs for Claude sessions</title>
    <meta name="description" content="A VS Code extension that keeps every Claude CLI session in a sidebar tree, grouped by ticket. It shows the PRs and tickets each session worked on, and it can suspend idle sessions and resume any of them from any repo.">
    <meta property="og:title" content="Overseer — vertical tabs for Claude sessions">
    <meta property="og:description" content="Group Claude CLI sessions by ticket, see the PRs and tickets each one worked on, and resume any of them from any repo. Sessions run in normal VS Code terminals.">
    <meta property="og:image" content="https://tory37.github.io/djaunt-overseer/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="assets/favicon.svg">

    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- With crossorigin, errors from these scripts show their real message instead of "Script error." -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Babel compiles the JSX in the text/babel script in the browser, so the site has no build step. -->
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>

    <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--dj-bg)',
                        surface: 'var(--dj-surface)',
                        raised: 'var(--dj-surface-raised)',
                        line: 'var(--dj-border)',
                        bone: 'var(--dj-text)',
                        muted: 'var(--dj-text-muted)',
                        accent: 'var(--dj-accent)',
                        'accent-hi': 'var(--dj-accent-hi)',
                        'accent-deep': 'var(--dj-accent-deep)',
                        'on-accent': 'var(--dj-on-accent)',
                        success: 'var(--dj-success)',
                        warning: 'var(--dj-warning)',
                    },
                    fontFamily: {
                        display: ['var(--dj-font-display)'],
                        sans: ['var(--dj-font-body)'],
                        mono: ['var(--dj-font-mono)'],
                    },
                    boxShadow: {
                        glow: 'var(--dj-glow)',
                        float: 'var(--dj-shadow-md)',
                    },
                    transitionTimingFunction: {
                        dj: 'var(--dj-ease)',
                    },
                    letterSpacing: {
                        display: 'var(--dj-tracking-display)',
                        label: 'var(--dj-tracking-label)',
                    },
                    spacing: {
                        '72': '18rem',
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-bg text-bone font-sans antialiased selection:bg-accent selection:text-on-accent min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const REPO_URL = 'https://github.com/tory37/djaunt-overseer';
        const VSIX_NAME = 'djaunt-overseer-0.0.13.vsix';
        const VSIX_URL = `${REPO_URL}/releases/latest/download/${VSIX_NAME}`;

        const Icon = ({ name, className = 'w-4 h-4' }) => {
            const iconHost = useRef(null);
            useEffect(() => {
                const iconSvg = lucide.createElement(lucide.icons[name]);
                iconSvg.setAttribute('width', '100%');
                iconSvg.setAttribute('height', '100%');
                iconSvg.setAttribute('stroke-width', '1.5');
                iconHost.current.replaceChildren(iconSvg);
            }, [name]);
            return <span ref={iconHost} aria-hidden="true" className={`inline-flex shrink-0 ${className}`} />;
        };

        // Same colors as scripts/link-icons.mjs writes for the extension's dark theme.
        const LINK_COLORS = {
            green: '#5FBF7A',
            gray: '#9DA3AE',
            purple: '#9F8AE6',
            red: '#E0492E',
            gold: '#F0C24B',
            cyan: '#7FD8F0',
            dim: '#6B6B6B',
        };

        const LinkIcon = ({ name, color }) => (
            <span style={{ color: LINK_COLORS[color] }} className="inline-flex"><Icon name={name} className="w-4 h-4" /></span>
        );

        const INITIAL_SESSIONS = [
            { id: '5f1c9a2e', title: 'PROJ-2567 login timeout', group: 'PROJ-2567', repo: 'web-app', branch: 'fix/proj-2567-login-timeout', extraRepos: ['api'], state: 'running' },
            { id: 'a83d0b17', title: 'PROJ-2567 review notes', group: 'PROJ-2567', repo: 'web-app', branch: 'main', extraRepos: [], state: 'compacting' },
            { id: 'c27e4f90', title: 'OPS-4410 billing export', group: 'OPS-4410', repo: 'api', branch: 'ops-4410-export', extraRepos: ['infra', 'web-app'], state: 'working' },
            { id: '0d9b6c33', title: 'Rate limiter refactor', group: 'Waiting on review', repo: 'api', branch: 'feat/rate-limit', extraRepos: [], state: 'suspended' },
            { id: '7e15a2c8', title: 'Docs site migration', group: 'Waiting on review', repo: 'docs', branch: 'main', extraRepos: [], state: 'elsewhere' },
            { id: '9a4c7d21', title: 'Flaky e2e triage', group: 'Ungrouped', repo: 'web-app', branch: 'main', extraRepos: [], state: 'duplicate' },
        ];

        const GROUPS = [
            { name: 'PROJ-2567', icon: 'Tag' },
            { name: 'OPS-4410', icon: 'Tag' },
            { name: 'Waiting on review', icon: 'Folder' },
            { name: 'Ungrouped', icon: 'Folder' },
        ];

        const INITIAL_TERMINALS = [
            { id: 't-dev', title: 'api dev server', group: 'OPS-4410', folder: 'api', isOpen: true, lines: [
                { kind: 'prompt', text: '~/src/api $ npm run dev' },
                { kind: 'out', text: '> api@1.4.0 dev' },
                { kind: 'out', text: '> tsx watch src/server.ts' },
                { kind: 'system', text: 'listening on http://localhost:3000' },
                { kind: 'muted', text: 'GET /health 200 4ms' },
            ] },
            { id: 't-tests', title: 'api test watcher', group: 'OPS-4410', folder: 'api', isOpen: true, lines: [
                { kind: 'prompt', text: '~/src/api $ npm test -- --watch' },
                { kind: 'out', text: ' ✓ billing.export (12 tests)' },
                { kind: 'out', text: ' ✓ rate-limit (8 tests)' },
                { kind: 'muted', text: 'Watching for file changes…' },
            ] },
            { id: 't-docs', title: 'docs preview', group: 'Ungrouped', folder: 'docs', isOpen: false, lines: [
                { kind: 'prompt', text: '~/src/docs $ npm run preview' },
                { kind: 'system', text: 'preview at http://localhost:4173' },
            ] },
        ];

        const TERMINAL_GROUPS = [
            { name: 'OPS-4410', icon: 'Tag' },
            { name: 'Ungrouped', icon: 'Folder' },
        ];

        const TerminalRow = ({ terminal, isSelected, onSelect }) => (
            <div
                onClick={() => onSelect(terminal.id)}
                className={`flex items-center gap-2 h-6 pl-8 pr-2 cursor-pointer border transition-colors duration-200 ease-dj ${isSelected ? 'bg-raised border-accent-deep' : 'border-transparent hover:bg-surface'}`}
            >
                <Icon name="Terminal" className={`w-4 h-4 ${terminal.isOpen ? 'text-success' : 'text-muted'}`} />
                <span className="flex-1 min-w-0 truncate text-xs">
                    <span className="text-bone">{terminal.title}</span>
                    <span className="text-muted ml-2">{terminal.folder} · {terminal.isOpen ? 'open' : 'closed'}</span>
                </span>
            </div>
        );

        const STATE_ICONS = {
            running: { name: 'SquareTerminal', className: 'text-success' },
            working: { name: 'LoaderCircle', className: 'text-success animate-spin motion-reduce:animate-none' },
            elsewhere: { name: 'AppWindow', className: 'text-warning' },
            suspended: { name: 'Pause', className: 'text-muted' },
            duplicate: { name: 'TriangleAlert', className: 'text-warning' },
            compacting: { name: 'RefreshCw', className: 'text-[#7FD8F0] animate-spin motion-reduce:animate-none' },
        };

        const LIVE_STATES = ['running', 'working', 'duplicate', 'compacting'];
        const isLiveHere = (session) => LIVE_STATES.includes(session.state);

        const reposLabel = (session) => {
            const extraCount = session.extraRepos.length;
            if (extraCount === 0) return '';
            return extraCount === 1 ? ' · +1 repo' : ` · +${extraCount} repos`;
        };

        const resumeTranscript = (session) => [
            { kind: 'prompt', text: `~/src/${session.repo} $ claude --resume ${session.id}-…` },
            { kind: 'muted', text: `resumed · ${session.title}` },
            { kind: 'input', text: '> where did we leave this' },
            { kind: 'out', text: 'Last step was the refresh check in src/auth/session.ts.' },
            { kind: 'out', text: 'The fix is in place. Tests still need a run.' },
        ];

        const SessionRow = ({ session, isSelected, onSelect, onToggle, onRename }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [draftTitle, setDraftTitle] = useState(session.title);
            const stateIcon = STATE_ICONS[session.state];
            const canSuspend = isLiveHere(session);
            const commitRename = () => {
                setIsEditing(false);
                const trimmedTitle = draftTitle.trim();
                if (trimmedTitle !== '' && trimmedTitle !== session.title) onRename(session.id, trimmedTitle);
                else setDraftTitle(session.title);
            };
            const description = session.state === 'duplicate'
                ? `2 copies running · ${session.repo}`
                : `${session.repo} · ${session.branch}${reposLabel(session)}`;
            return (
                <div
                    onClick={() => onSelect(session.id)}
                    onDoubleClick={() => setIsEditing(true)}
                    title="Double-click to rename"
                    className={`group flex items-center gap-2 h-6 pl-8 pr-2 cursor-pointer border transition-colors duration-200 ease-dj ${isSelected ? 'bg-raised border-accent-deep' : 'border-transparent hover:bg-surface'}`}
                >
                    <Icon name={stateIcon.name} className={`w-4 h-4 ${stateIcon.className}`} />
                    {isEditing ? (
                        <input
                            autoFocus
                            value={draftTitle}
                            onChange={(event) => setDraftTitle(event.target.value)}
                            onBlur={commitRename}
                            onKeyDown={(event) => { if (event.key === 'Enter') commitRename(); if (event.key === 'Escape') { setDraftTitle(session.title); setIsEditing(false); } }}
                            onClick={(event) => event.stopPropagation()}
                            className="flex-1 min-w-0 h-5 px-1 bg-bg border border-accent text-bone font-mono text-xs outline-none"
                        />
                    ) : (
                        <span className="flex-1 min-w-0 truncate text-xs">
                            <span className="text-bone">{session.title}</span>
                            <span className="text-muted ml-2">{description}</span>
                        </span>
                    )}
                    <button
                        onClick={(event) => { event.stopPropagation(); onToggle(session.id); }}
                        aria-label={canSuspend ? 'Suspend' : 'Resume'}
                        className={`p-0.5 text-muted hover:text-accent transition-opacity duration-200 ease-dj ${isSelected ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
                    >
                        <Icon name={canSuspend ? 'Pause' : 'Play'} className="w-4 h-4" />
                    </button>
                </div>
            );
        };

        const TerminalLine = ({ line }) => {
            const lineColors = { prompt: 'text-accent', muted: 'text-muted', input: 'text-bone', out: 'text-bone', system: 'text-success' };
            return <div className={`whitespace-pre-wrap break-words ${lineColors[line.kind]}`}>{line.text}</div>;
        };

        const OverseerMock = () => {
            const [sessions, setSessions] = useState(INITIAL_SESSIONS);
            const [selectedId, setSelectedId] = useState(INITIAL_SESSIONS[0].id);
            const [terminalLines, setTerminalLines] = useState(() => {
                const initialLines = {};
                INITIAL_SESSIONS.forEach((session) => { initialLines[session.id] = resumeTranscript(session); });
                return initialLines;
            });

            const [terminals, setTerminals] = useState(INITIAL_TERMINALS);
            const selectedSession = sessions.find((session) => session.id === selectedId);
            const selectedTerminal = terminals.find((terminal) => terminal.id === selectedId);
            const openTabs = sessions.filter(isLiveHere);
            const openTerminals = terminals.filter((terminal) => terminal.isOpen);
            const openTerminal = (terminalId) => {
                setTerminals((previous) => previous.map((terminal) => (terminal.id === terminalId ? { ...terminal, isOpen: true } : terminal)));
                setSelectedId(terminalId);
            };

            const appendLines = (sessionId, newLines) =>
                setTerminalLines((previous) => ({ ...previous, [sessionId]: [...previous[sessionId], ...newLines] }));

            const toggleSession = (sessionId) => {
                const target = sessions.find((session) => session.id === sessionId);
                const nextState = isLiveHere(target) ? 'suspended' : 'running';
                setSessions((previous) => previous.map((session) => (session.id === sessionId ? { ...session, state: nextState } : session)));
                if (nextState === 'suspended') {
                    appendLines(sessionId, [{ kind: 'input', text: '> /exit' }, { kind: 'muted', text: 'process exited · transcript kept on disk' }]);
                } else {
                    setTerminalLines((previous) => ({ ...previous, [sessionId]: resumeTranscript(target) }));
                }
                setSelectedId(sessionId);
            };

            const renameSession = (sessionId, newTitle) => {
                const target = sessions.find((session) => session.id === sessionId);
                setSessions((previous) => previous.map((session) => (session.id === sessionId ? { ...session, title: newTitle } : session)));
                if (isLiveHere(target)) {
                    appendLines(sessionId, [{ kind: 'input', text: `> /rename ${newTitle}` }, { kind: 'system', text: `Session renamed to: ${newTitle}` }]);
                }
                setSelectedId(sessionId);
            };

            const isSelectedLive = selectedSession !== undefined && isLiveHere(selectedSession);

            return (
                <div className="border border-line bg-bg font-mono text-xs shadow-float">
                    <div className="flex items-center gap-2 h-8 px-3 border-b border-line bg-surface">
                        <span className="w-2.5 h-2.5 rounded-full bg-line" />
                        <span className="w-2.5 h-2.5 rounded-full bg-line" />
                        <span className="w-2.5 h-2.5 rounded-full bg-line" />
                        <span className="flex-1 text-center text-muted truncate">agent-tools — Visual Studio Code</span>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-[3rem_26rem_1fr]">
                        <div className="hidden md:flex flex-col items-center gap-4 py-3 border-r border-line bg-surface text-muted">
                            <Icon name="Files" className="w-5 h-5" />
                            <Icon name="Search" className="w-5 h-5" />
                            <Icon name="GitBranch" className="w-5 h-5" />
                            <span className="relative flex justify-center w-full">
                                <span className="absolute left-0 top-0 bottom-0 w-0.5 bg-accent" />
                                <img src="assets/overseer-gold.svg" alt="" className="w-6 h-6" />
                            </span>
                        </div>
                        <div className="border-b md:border-b-0 md:border-r border-line bg-surface">
                            <div className="flex items-center justify-between h-8 px-3 text-muted">
                                <span className="uppercase tracking-label">Overseer</span>
                                <span className="flex gap-2">
                                    <Icon name="Plus" className="w-4 h-4" />
                                    <Icon name="Search" className="w-4 h-4" />
                                    <Icon name="FolderPlus" className="w-4 h-4" />
                                    <Icon name="RefreshCw" className="w-4 h-4" />
                                </span>
                            </div>
                            <div className="pb-3">
                                {GROUPS.map((group) => {
                                    const groupSessions = sessions.filter((session) => session.group === group.name);
                                    return (
                                        <div key={group.name}>
                                            <div className="group/row flex items-center gap-1 h-6 px-2 text-bone hover:bg-raised">
                                                <Icon name="ChevronDown" className="w-4 h-4 text-muted" />
                                                <Icon name={group.icon} className="w-4 h-4 text-muted" />
                                                <span className="font-medium">{group.name}</span>
                                                <span className="text-muted ml-1">{groupSessions.length}</span>
                                                <span className="ml-auto flex items-center gap-1 text-muted opacity-0 group-hover/row:opacity-100 transition-opacity duration-200 ease-dj" aria-hidden="true">
                                                    <Icon name="Plus" className="w-4 h-4" />
                                                    <Icon name="Search" className="w-4 h-4" />
                                                </span>
                                            </div>
                                            {groupSessions.map((session) => (
                                                <SessionRow
                                                    key={session.id}
                                                    session={session}
                                                    isSelected={session.id === selectedId}
                                                    onSelect={setSelectedId}
                                                    onToggle={toggleSession}
                                                    onRename={renameSession}
                                                />
                                            ))}
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="pb-3 border-t border-line">
                                <div className="flex items-center justify-between h-8 px-3 text-muted">
                                    <span className="flex items-center gap-1">
                                        <Icon name="ChevronDown" className="w-4 h-4" />
                                        <span className="uppercase tracking-label">Terminals</span>
                                    </span>
                                    <Icon name="Plus" className="w-4 h-4" />
                                </div>
                                {TERMINAL_GROUPS.map((group) => {
                                    const groupTerminals = terminals.filter((terminal) => terminal.group === group.name);
                                    return (
                                        <div key={group.name}>
                                            <div className="flex items-center gap-1 h-6 px-2 text-bone">
                                                <Icon name="ChevronDown" className="w-4 h-4 text-muted" />
                                                <Icon name={group.icon} className="w-4 h-4 text-muted" />
                                                <span className="font-medium">{group.name}</span>
                                                <span className="text-muted ml-1">{groupTerminals.length}</span>
                                            </div>
                                            {groupTerminals.map((terminal) => (
                                                <TerminalRow key={terminal.id} terminal={terminal} isSelected={terminal.id === selectedId} onSelect={setSelectedId} />
                                            ))}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="flex flex-col min-w-0 min-h-72">
                            <div className="flex h-8 border-b border-line bg-surface overflow-hidden">
                                {openTabs.map((session) => (
                                    <button
                                        key={session.id}
                                        onClick={() => setSelectedId(session.id)}
                                        className={`flex items-center gap-2 px-3 border-r border-line max-w-48 ${session.id === selectedId ? 'bg-bg text-bone border-t border-t-accent' : 'text-muted hover:text-bone'}`}
                                    >
                                        <Icon name="SquareTerminal" className="w-4 h-4" />
                                        <span className="truncate">{session.title}</span>
                                    </button>
                                ))}
                                {openTerminals.map((terminal) => (
                                    <button
                                        key={terminal.id}
                                        onClick={() => setSelectedId(terminal.id)}
                                        className={`flex items-center gap-2 px-3 border-r border-line max-w-48 ${terminal.id === selectedId ? 'bg-bg text-bone border-t border-t-accent' : 'text-muted hover:text-bone'}`}
                                    >
                                        <Icon name="Terminal" className="w-4 h-4" />
                                        <span className="truncate">{terminal.title}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 p-4 space-y-1 leading-relaxed">
                                {selectedTerminal !== undefined ? (
                                    selectedTerminal.isOpen ? (
                                        selectedTerminal.lines.map((line, lineIndex) => <TerminalLine key={lineIndex} line={line} />)
                                    ) : (
                                        <div className="flex flex-col items-start gap-3 text-muted">
                                            <span>Closed. Open starts a new shell in ~/src/{selectedTerminal.folder}.</span>
                                            <button
                                                onClick={() => openTerminal(selectedTerminal.id)}
                                                className="flex items-center gap-2 px-3 h-7 border border-line text-bone hover:border-accent hover:text-accent transition-colors duration-200 ease-dj"
                                            >
                                                <Icon name="Play" className="w-4 h-4" />
                                                Open
                                            </button>
                                        </div>
                                    )
                                ) : isSelectedLive ? (
                                    terminalLines[selectedId].map((line, lineIndex) => <TerminalLine key={lineIndex} line={line} />)
                                ) : (
                                    <div className="flex flex-col items-start gap-3 text-muted">
                                        <span>{selectedSession.state === 'elsewhere' ? 'Running in another window.' : 'Suspended. No process, no memory. The transcript is on disk.'}</span>
                                        <button
                                            onClick={() => toggleSession(selectedId)}
                                            className="flex items-center gap-2 px-3 h-7 border border-line text-bone hover:border-accent hover:text-accent transition-colors duration-200 ease-dj"
                                        >
                                            <Icon name="Play" className="w-4 h-4" />
                                            {selectedSession.state === 'elsewhere' ? 'Fork a copy here' : 'Resume'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const QuickPickVisual = () => (
            <div className="border border-line bg-surface font-mono text-xs">
                <div className="flex items-center gap-2 h-8 px-3 border-b border-line">
                    <Icon name="Search" className="w-4 h-4 text-muted" />
                    <span className="text-bone">repo:api billing</span>
                    <span className="w-px h-4 bg-accent animate-pulse motion-reduce:animate-none" />
                </div>
                {[
                    { title: 'OPS-4410 billing export', meta: 'api · ops-4410-export · +2 repos', detail: 'working · ~/src/api' },
                    { title: 'Billing webhook retries', meta: 'web-app · main · +1 repo', detail: '3d ago · ~/src/web-app · also api' },
                ].map((item, itemIndex) => (
                    <div key={item.title} className={`px-3 py-2 ${itemIndex === 0 ? 'bg-raised' : ''}`}>
                        <div className="flex gap-2 truncate"><span className="text-bone">{item.title}</span><span className="text-muted truncate">{item.meta}</span></div>
                        <div className="text-muted truncate">{item.detail}</div>
                    </div>
                ))}
            </div>
        );

        const SuspendVisual = () => (
            <div className="font-mono text-xs space-y-2">
                {[
                    { icon: 'SquareTerminal', iconClass: 'text-success', label: 'running', note: 'process + memory' },
                    { icon: 'Pause', iconClass: 'text-muted', label: '/exit', note: 'tab closes, transcript stays' },
                    { icon: 'Play', iconClass: 'text-accent', label: 'claude --resume <id>', note: 'right directory, full history' },
                ].map((step) => (
                    <div key={step.label} className="flex items-center gap-3 h-8 px-3 border border-line bg-surface">
                        <Icon name={step.icon} className={`w-4 h-4 ${step.iconClass}`} />
                        <span className="text-bone">{step.label}</span>
                        <span className="ml-auto text-muted truncate">{step.note}</span>
                    </div>
                ))}
            </div>
        );

        const GroupVisual = () => (
            <div className="font-mono text-xs border border-line bg-surface py-1">
                {[
                    { indent: false, icon: 'Tag', text: 'PROJ-2567', count: '3' },
                    { indent: true, icon: 'SquareTerminal', text: 'PROJ-2567 login timeout' },
                    { indent: true, icon: 'Pause', text: 'proj-2567 review notes' },
                    { indent: true, icon: 'Pause', text: 'branch fix/proj-2567-cookie' },
                ].map((row) => (
                    <div key={row.text} className={`flex items-center gap-2 h-6 ${row.indent ? 'pl-8' : 'pl-3'} text-bone`}>
                        <Icon name={row.icon} className="w-4 h-4 text-muted" />
                        <span className="truncate">{row.text}</span>
                        {row.count && <span className="text-muted">{row.count}</span>}
                    </div>
                ))}
            </div>
        );

        const RenameVisual = () => (
            <div className="font-mono text-xs space-y-2">

                    <span className="text-muted">Pick a workspace</span>
                </div>
                {[
                    { name: 'Work', detail: 'current · 6 sessions · 2 terminals', isPicked: false },
                    { name: 'After hours', detail: '2 sessions · 1 terminal', isPicked: true },
                    { name: 'Default', detail: 'empty', isPicked: false },
                ].map((workspace) => (
                    <div key={workspace.name} className={`flex items-center gap-2 h-7 px-3 ${workspace.isPicked ? 'bg-raised' : ''}`}>
                        <Icon name="Layers" className="w-4 h-4 text-muted" />
                        <span className="text-bone">{workspace.name}</span>
                        <span className="text-muted truncate">{workspace.detail}</span>
                    </div>
                ))}
            </div>
        );

        // A lone last card spans both columns, so the grid never shows an empty cell.
        const isLastOfOddCount = (index, count) => count % 2 === 1 && index === count - 1;

        const FEATURES = [
            { title: 'Resume a session from any repo', body: 'claude --resume lists only the sessions that started in the current directory. All Sessions searches every repo and resumes each session in the directory it started in.', Visual: QuickPickVisual },
            { title: 'Search every past session', body: 'Session History opens in an editor tab, like Settings. Search every session by title, prompt, recap, branch, or PR, and filter by repo, age, pinned, or running. The detail pane shows more than All Sessions: recap, prompts, commits, and the PR. Open resumes the session. Delete removes one from your machine for good, and Purge removes every session the filters show. Both list what goes and ask first. Running sessions are never deleted, and Purge skips pinned ones.', Visual: HistoryVisual },
            { title: 'Switch between workspaces', isExperimental: true, body: 'Keep work, side projects, and after-hours sessions apart. Each workspace has its own sessions, terminals, and groups. A switch suspends the running sessions, closes the terminals and file tabs, then brings back what was open in the other workspace. It asks first when Claude is mid-task or a file has unsaved changes. This one is experimental. It works, but it needs more testing.', Visual: WorkspaceVisual },
            { title: 'Suspend a session and resume it later', body: 'When a session waits on a review for days, Suspend sends /exit so the process and its memory are freed. Resume starts the same session again with its full history.', Visual: SuspendVisual },
            { title: 'Follow the focused session in the Session sidebar', body: 'The Session sidebar sits to the right of the editor and follows the session you focus, terminal or preview. It shows the folder, branch, and summary, with Suspend, Resume, or Fork when the session runs elsewhere. The Claude actions (Compact, Clear, Model, Cost, Run command) appear when the session runs here and is idle. The Session actions (Summarize, Find links, Open repo, Set status, Rename) always show.', Visual: SessionSidebarVisual },
            { title: 'Peek at a paused session without starting it', body: 'Click a session with no terminal here and it opens in one reused Session Preview tab. The preview shows where the session left off, its last turns, its prompts, and the commits and PRs it made. It reads the transcript and git, so it never starts Claude. Resume replaces the preview with the terminal.', Visual: PreviewVisual },
            { title: 'Let the agent say what it works on', body: 'Sessions that Overseer starts get an overseer CLI on PATH and a track skill. The agent declares the tickets it works on, the commits it makes, and the PRs it opens. It skips what it only read. For an older session, Populate all asks Haiku to read a digest of the transcript and declare the same things.', Visual: TrackingVisual },
            { title: 'Find the PRs, tickets, and artifacts a session worked on', body: 'Click Find links in the Session sidebar. Overseer scans the transcript, and a short Haiku run sorts what it found into owned, touched, and seen in passing. Nothing scans until you ask.', Visual: LinksVisual },
            { title: 'See a session\'s links in the sidebar', body: 'The Session sidebar follows the focused session. Working on holds what the agent declared and what you pinned, with the agent\'s note. Also seen holds the rest. Links nest as parent ticket, sub-tickets, then the PRs for each ticket. Each row opens in your browser, pins, or opens a menu to open in VS Code, copy, move a ticket to another status, or remove. Drag rows to reorder them.', Visual: LinksPanelVisual },
            { title: 'Check PR and ticket status at a glance', body: 'Each PR and ticket shows its live status, and its icon takes the color you pick for that status. PR status comes from gh. Ticket status comes from the Jira MCP server Claude Code already uses.', Visual: LinkStatusVisual },
            { title: 'Pin or remove a link', body: 'A pinned link moves to Working on, even when the judge thinks it does not matter. A removed link stays out, even if the agent declares it again. Both survive a rescan. Hover the Also seen header and use Filter to show removed links again, so you can restore them.', Visual: PinVisual },
            { title: 'Pick your own icons and colors', body: 'The Settings panel sets the icon and color for each session state, a color for every status in each Jira project, a color for each PR state, and which views show. Type Overseer in the Command Palette to reach every setting.', Visual: SettingsVisual },
            { title: 'Keep plain terminals in their own view', body: 'New Terminal opens a shell in a folder you pick. Terminals get their own Terminals view, apart from your Claude sessions, with the same ticket and custom groups. Click one to bring it forward, and reopen it in the same folder after you close it. Settings can hide the Sessions, Terminals, and Repos views.', Visual: TerminalVisual },
            { title: 'Mark where each session stands', body: 'Set Status puts a session or terminal in Todo, Triage, In Progress, Blocked, AI Review, Human Review, or Ready to Ship. The status tints the row and adds a short badge. Blocked asks why, and the reason shows in the row\'s tooltip. Statuses do not follow Jira, so a status like Triage works. The Settings panel adds, renames, reorders, and recolors them.', Visual: StatusMarkVisual },
            { title: 'Send your usual prompts in two clicks', body: 'Click Run command in the Session sidebar while the session is idle. Pick a saved prompt, like Check PR Reviews, and Overseer types it into the session. Write {ticket link} in a prompt and Overseer asks for that value first. The list is the overseer.sessionCommands setting.', Visual: CommandsVisual },
            { title: 'Watch every repo from a window with no folder open', body: 'The Repos view lists the repos your pinned sessions and terminals work in. Each row shows the branch, ahead and behind counts, and uncommitted changes, and updates when the repo changes. Expand a repo for its last 20 commits. A commit a session made shows that session. Click a commit to read its diff, or open the repo in Source Control.', Visual: RepoHistoryVisual },
            { title: 'See when a session is compacting', body: 'A compacting session shows a spinning icon until it finishes. Claude Code does not report compaction, so Overseer offers to install a PreCompact and a PostCompact hook. Skip the prompt and install them later from the Command Palette.', Visual: CompactVisual },
            { title: 'Group sessions by ticket', body: 'Overseer reads the ticket key from the title, branch, or first prompt and puts the session in that ticket\'s group. Drag a session to put it somewhere else.', Visual: GroupVisual },
            { title: 'Rename a session in one step', body: 'Double-click or F2 renames the row and the tab, even while Claude is busy. When the session is idle, Overseer also sends /rename, so the tree, the tab, and Claude all use the same name.', Visual: RenameVisual },
            { title: 'See which sessions are running', body: 'Status comes from claude agents --json and updates each time a session goes busy or idle. Click a terminal tab and its row in the sidebar is selected, so you can see where you are.', Visual: StatusVisual },
            { title: 'Stop a session from running twice', body: 'Two processes writing to one transcript corrupt it. Overseer marks duplicates and offers to fork a copy instead of resuming a second time.', Visual: DuplicateVisual },
            { title: 'Find a session from any repo it edited', body: 'A session that starts in one repo and edits another shows +N repos. Type repo:<name> in All Sessions to find it from the repo it edited.', Visual: ReposVisual },
            { title: 'Arrange groups and sessions', body: 'Each group has a + button for a new session and a search button to add an existing one. Drag groups and sessions to reorder them. The Claude actions, like Compact and Model, live in the Session sidebar.', Visual: OrganizeVisual },
        ];

        const HOW_IT_WORKS = [
            { step: '01', title: 'Index', body: 'Reads ~/.claude/projects/*/*.jsonl and caches by size and mtime. 130 sessions, 700 MB: 1.6s cold, about 2ms after.' },
            { step: '02', title: 'Watch', body: 'claude agents --json for live status, plus a file watch on ~/.claude/sessions so busy and idle show up within a second.' },
            { step: '03', title: 'Launch', body: 'Each session is a terminal that execs claude directly. /exit closes the tab. A window reload reattaches terminals by pid.' },
            { step: '04', title: 'Links', body: 'Find links scans one transcript for links. A headless claude -p run with Haiku reads an 8 KB digest of them and sorts them. At most two runs at once, and each result is cached. Status checks run every five minutes while the sidebar shows them.' },
            { step: '05', title: 'Hooks', body: 'Optional PreCompact and PostCompact hooks in ~/.claude/settings.json write and delete a marker per session in ~/.claude/overseer/compacting. Install backs up the file first and leaves your own hooks alone.' },
            { step: '06', title: 'Repos', body: 'git status and git log run per repo, at most four at once, only while the Repos view shows. A watch on each .git folder refreshes a repo a second after it changes. The indexer reads commit hashes from transcripts to match commits to sessions.' },
            { step: '07', title: 'Track', body: 'The overseer CLI writes small JSON files under ~/.claude/overseer, and every window watches that folder. No server, no port, no login. On /clear the declarations move to the new session ID.' },
            { step: '08', title: 'Statuses', body: 'The list lives in the overseer.sessionStatuses setting. Each session\'s status and reason are saved in the extension\'s state, and a file decoration tints the row. None of it calls a model.' },
        ];

        const INSTALL_COMMANDS = `curl -LO ${VSIX_URL}\ncode --install-extension ${VSIX_NAME}`;

        const CopyBlock = ({ text }) => {
            const [wasCopied, setWasCopied] = useState(false);
            const copyText = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                    setWasCopied(true);
                    setTimeout(() => setWasCopied(false), 1600);
                } catch {
                    setWasCopied(false);
                }
            };
            return (
                <div className="relative border border-line bg-surface">
                    <button
                        onClick={copyText}
                        aria-label="Copy commands"
                        className="absolute top-3 right-3 p-1 text-muted hover:text-accent transition-colors duration-200 ease-dj"
                    >
                        <Icon name={wasCopied ? 'Check' : 'Copy'} className="w-4 h-4" />
                    </button>
                    <pre className="p-5 pr-12 font-mono text-sm leading-relaxed whitespace-pre-wrap break-all">
                        {text.split('\n').map((commandLine) => (
                            <div key={commandLine}><span className="text-accent select-none">$ </span><span className="text-bone">{commandLine}</span></div>
                        ))}
                    </pre>
                </div>
            );
        };

        const App = () => (
            <div className="w-full">
                <header className="max-w-6xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between border-b border-line">
                    <a href="#" className="flex items-center gap-3">
                        <img src="assets/overseer-gold.svg" alt="" className="w-6 h-6" />
                        <span className="font-display font-bold tracking-display text-lg">overseer</span>
                    </a>
                    <nav className="flex items-center gap-6 font-mono text-xs uppercase tracking-label text-muted">
                        <a href="#features" className="hidden sm:inline hover:text-accent transition-colors duration-200 ease-dj">Features</a>
                        <a href="#install" className="hidden sm:inline hover:text-accent transition-colors duration-200 ease-dj">Install</a>
                        <a href={REPO_URL} className="flex items-center gap-2 hover:text-accent transition-colors duration-200 ease-dj"><Icon name="GitBranch" className="w-4 h-4" />Source</a>
                    </nav>
                </header>

                <section className="max-w-6xl mx-auto px-4 md:px-8 pt-16 pb-24 md:pt-24">
                    <div className="space-y-16">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
                        <div className="lg:col-span-7 space-y-6">
                            <h1 className="font-display font-bold tracking-display leading-[1.08] text-[clamp(2.5rem,5.5vw,4.5rem)]">
                                Vertical tabs for Claude sessions.
                            </h1>
                        </div>
                        <div className="lg:col-span-5 space-y-6">
                            <p className="text-lg text-bone leading-relaxed">
                                Overseer is a VS Code extension that keeps every Claude CLI session in a sidebar tree, grouped by ticket. For any session, it finds the PRs, tickets, and artifacts that session worked on. You can suspend the sessions you are waiting on and resume any of them from any repo, without remembering an ID.
                            </p>
                            <p className="text-muted">Each session runs in a normal VS Code terminal. Plain terminals, like a dev server or a test watcher, get their own view with the same groups.</p>
                            <div className="flex flex-wrap gap-3 pt-2">
                                <a href={VSIX_URL} className="flex items-center gap-2 h-11 px-5 bg-accent text-on-accent font-medium shadow-glow transition-transform duration-200 ease-dj hover:scale-[1.02]">
                                    <Icon name="Download" className="w-4 h-4" />Download .vsix
                                </a>
                                <a href={REPO_URL} className="flex items-center gap-2 h-11 px-5 border border-line text-bone hover:border-accent hover:text-accent transition-colors duration-200 ease-dj">
                                    <Icon name="GitBranch" className="w-4 h-4" />Source on GitHub
                                </a>
                            </div>
                        </div>
                        </div>
                        <div className="xl:-mr-32 space-y-3">
                            <OverseerMock />
                            <p className="font-mono text-xs text-muted">This is a live demo. Click a row to see its terminal, click the pause or play icon on a session, or double-click a title to rename it.</p>
                        </div>
                    </div>
                </section>

                <section className="border-y border-line bg-surface">
                    <div className="max-w-6xl mx-auto px-4 md:px-8 py-16 space-y-6">
                        <h2 className="font-display font-bold tracking-display text-3xl leading-tight max-w-[40rem]">The problem it solves</h2>
                        <div>
                            <ul className="space-y-3 text-bone max-w-[65ch]">
                                {[
                                    'Terminal tabs pile up across the top of the editor, and none of them say which ticket they are for.',
                                    'An idle session that waits two days on a review still holds its memory.',
                                    'claude --resume lists only the sessions that started in the current directory. A fix that began in one repo cannot be found from another.',
                                    'The PR and ticket a session worked on are buried somewhere in its transcript.',
                                ].map((problemLine) => (
                                    <li key={problemLine} className="flex gap-3">
                                        <Icon name="ChevronRight" className="w-4 h-4 mt-1 text-accent" />
                                        <span>{problemLine}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </section>

                <section id="features" className="max-w-6xl mx-auto px-4 md:px-8 py-24 space-y-12">
                    <h2 className="font-display font-bold tracking-display text-3xl leading-tight max-w-[40rem]">What it does</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-px bg-line border border-line">
                        {FEATURES.map(({ title, body, Visual, isExperimental }, featureIndex) => (
                            <article key={title} className={`bg-bg p-6 md:p-8 flex flex-col gap-6 ${isLastOfOddCount(featureIndex, FEATURES.length) ? 'md:col-span-2' : ''}`}>
                                <div className="space-y-2">
                                    <h3 className="font-display font-semibold tracking-display text-xl">{title}</h3>
                                    {isExperimental && (
                                        <span className="inline-flex items-center gap-1 px-2 h-6 border border-warning text-warning font-mono text-xs uppercase tracking-label">
                                            <Icon name="FlaskConical" className="w-3 h-3" />Experimental
                                        </span>
                                    )}
                                    <p className="text-muted leading-relaxed">{body}</p>
                                </div>
                                <div className="mt-auto"><Visual /></div>
                            </article>
                        ))}
                    </div>
                </section>

                <section className="border-y border-line bg-surface">
                    <div className="max-w-6xl mx-auto px-4 md:px-8 py-24 grid grid-cols-1 md:grid-cols-12 gap-8">
                        <div className="md:col-span-4 space-y-4">
                            <h2 className="font-display font-bold tracking-display text-3xl leading-tight">How it works</h2>
                            <p className="text-muted">Overseer reads the files Claude Code already writes to disk, plus two optional hooks for compaction. The tree, the grouping, and the live status make no model calls. Link sorting and the Summarize with Haiku button run Haiku through your own claude CLI, so they count against your Claude usage.</p>
                        </div>
                        <ol className="md:col-span-8 border-t border-line">
                            {HOW_IT_WORKS.map((item) => (
                                <li key={item.step} className="grid grid-cols-[3rem_1fr] md:grid-cols-[4rem_8rem_1fr] gap-4 py-6 border-b border-line">
                                    <span className="font-mono text-sm text-accent">{item.step}</span>
                                    <span className="font-display font-semibold">{item.title}</span>
                                    <span className="col-span-2 md:col-span-1 text-muted leading-relaxed">{item.body}</span>
                                </li>
                            ))}
                        </ol>
                    </div>
                </section>

                <section id="install" className="max-w-6xl mx-auto px-4 md:px-8 py-24 grid grid-cols-1 md:grid-cols-12 gap-8">
                    <div className="md:col-span-4 space-y-4">
                        <h2 className="font-display font-bold tracking-display text-3xl leading-tight">Install</h2>
                        <p className="text-muted">Download the .vsix and install it with the code CLI. You can also open Extensions in VS Code, click the ... menu, and choose Install from VSIX.</p>
                    </div>
                    <div className="md:col-span-8 space-y-6">
                        <CopyBlock text={INSTALL_COMMANDS} />
                        <dl className="grid grid-cols-1 sm:grid-cols-2 gap-px bg-line border border-line font-mono text-xs">
                            {[
                                ['VS Code', '1.106 or newer'],
                                ['Claude Code', 'claude on your PATH'],
                                ['Link status (optional)', 'gh for PRs, a Jira MCP server in ~/.claude.json for tickets'],
                                ['Platform', 'Tested on macOS. Linux and Windows untested.'],
                            ].map(([requirement, value]) => (
                                <div key={requirement} className="bg-bg p-4 space-y-1">
                                    <dt className="uppercase tracking-label text-muted">{requirement}</dt>
                                    <dd className="text-bone">{value}</dd>
                                </div>
                            ))}
                        </dl>
                    </div>
                </section>

                <footer className="border-t border-line">
                    <div className="max-w-6xl mx-auto px-4 md:px-8 py-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                        <img src="assets/djaunt-lockup-gold.svg" alt="Djaunt" className="h-8" />
                        <p className="font-mono text-xs text-muted">Overseer is a Djaunt tool. Not affiliated with Anthropic.</p>
                    </div>
                </footer>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
