<!DOCTYPE html>
<html lang="en" data-dj-theme="hoard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseer Theme Lab</title>

    <link rel="stylesheet" href="../docs/assets/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js"></script>

    <!-- Generated by npm run theme-lab. -->
    <script src="lab-data.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--dj-bg)',
                        surface: 'var(--dj-surface)',
                        raised: 'var(--dj-surface-raised)',
                        line: 'var(--dj-border)',
                        bone: 'var(--dj-text)',
                        muted: 'var(--dj-text-muted)',
                        accent: 'var(--dj-accent)',
                        'accent-hi': 'var(--dj-accent-hi)',
                        'on-accent': 'var(--dj-on-accent)',
                        success: 'var(--dj-success)',
                        warning: 'var(--dj-warning)',
                        danger: 'var(--dj-danger)',
                    },
                    fontFamily: {
                        display: ['var(--dj-font-display)'],
                        sans: ['var(--dj-font-body)'],
                        mono: ['var(--dj-font-mono)'],
                    },
                    letterSpacing: {
                        display: 'var(--dj-tracking-display)',
                        label: 'var(--dj-tracking-label)',
                    },
                },
            },
        };
    </script>
    <style>
        .wb { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.4; }
        .wb-mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
        .wb * { box-sizing: border-box; }
        .wb [data-needs-code] { outline: 1px dashed #FF2BD6; outline-offset: -1px; }
        .wb [data-needs-code]:not(.absolute) { position: relative; }
        .wb [data-needs-code]::after { content: 'needs code'; position: absolute; top: -6px; right: -2px; z-index: 5; padding: 0 3px; font: 600 8px/11px ui-monospace, monospace; color: #FFFFFF; background: #B0108F; border-radius: 2px; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body class="bg-bg text-bone font-sans antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useRef, useContext, createContext, useMemo } = React;

        const LAB = window.THEME_LAB;
        const MOCK_WIDTH = 1100;
        const MOCK_HEIGHT = 680;
        const STORAGE_KEY = 'overseer.themeLab.controls';
        const THEME_IDS = ['hoard', 'ember', 'frost', 'parchment'];

        // ---------- Color plumbing: every workbench color is a CSS variable named after its VS Code key. ----------

        const cssVarName = (colorKey) => `--vsc-${colorKey.replace(/\./g, '-')}`;
        const c = (colorKey, fallback) => (fallback ? `var(${cssVarName(colorKey)}, ${fallback})` : `var(${cssVarName(colorKey)})`);
        // A key is deliverable when the extension contributes it, a shipped theme sets it, or VS Code has it built in.
        const BUILT_IN_UNSET_KEYS = [];
        const DELIVERABLE_COLOR_IDS = new Set([...LAB.contributedColorIds, ...LAB.shippedBuiltInColorIds, ...BUILT_IN_UNSET_KEYS]);
        const isDeliverableKey = (colorKey) => colorKey.startsWith('tok:') || colorKey.endsWith('*') || DELIVERABLE_COLOR_IDS.has(colorKey);
        const region = (name, colorKeys) => ({
            'data-region': name,
            'data-keys': colorKeys.join(','),
            ...(colorKeys.every(isDeliverableKey) ? {} : { 'data-needs-code': colorKeys.filter((colorKey) => !isDeliverableKey(colorKey)).join(',') }),
        });

        const SNIPPET_SCOPES = {
            kw: 'keyword.control',
            storage: 'storage.type',
            modifier: 'storage.modifier',
            newOp: 'keyword.operator.new',
            fn: 'entity.name.function',
            str: 'string.quoted.double',
            tpl: 'string.template',
            num: 'constant.numeric.decimal',
            type: 'entity.name.type',
            prim: 'support.type.primitive',
            prop: 'variable.other.property',
            param: 'variable.parameter',
            variable: 'variable.other.readwrite',
            cnst: 'variable.other.constant',
            op: 'keyword.operator',
            punc: 'punctuation',
            cmt: 'comment.line.double-slash',
            tag: 'entity.name.tag.tsx',
            attr: 'entity.other.attribute-name.tsx',
            tagPunc: 'punctuation.definition.tag.begin.tsx',
        };

        // TextMate prefix matching: the deepest matching selector wins, a later rule wins a tie.
        function resolveScope(tokenColors, scope) {
            let best = null;
            let bestDepth = -1;
            for (const rule of tokenColors) {
                const selectors = Array.isArray(rule.scope) ? rule.scope : String(rule.scope).split(',').map((s) => s.trim());
                for (const selector of selectors) {
                    if (selector.includes(' ')) continue;
                    if (scope === selector || scope.startsWith(selector + '.')) {
                        const depth = selector.split('.').length;
                        if (depth >= bestDepth) { best = { rule: rule.name, selector, settings: rule.settings }; bestDepth = depth; }
                    }
                }
            }
            return best;
        }

        function themeVariables(built) {
            const variables = Object.fromEntries(Object.entries(built.colors).map(([colorKey, hex]) => [cssVarName(colorKey), hex]));
            for (const [short, scope] of Object.entries(SNIPPET_SCOPES)) {
                const match = resolveScope(built.tokenColors, scope);
                if (match?.settings?.foreground) variables[`--tok-${short}`] = match.settings.foreground;
            }
            return variables;
        }

        function tokenStyles(built) {
            return Object.fromEntries(Object.entries(SNIPPET_SCOPES).map(([short, scope]) => {
                const fontStyle = resolveScope(built.tokenColors, scope)?.settings?.fontStyle ?? '';
                return [short, {
                    color: `var(--tok-${short}, ${c('editor.foreground')})`,
                    fontWeight: fontStyle.includes('bold') ? 700 : 400,
                    fontStyle: fontStyle.includes('italic') ? 'italic' : 'normal',
                }];
            }));
        }

        const MockContext = createContext(null);

        // ---------- Icons ----------

        const Icon = ({ name, size = 16, style, className = '' }) => {
            const host = useRef(null);
            useEffect(() => {
                const iconNode = lucide.icons[name];
                if (!iconNode || !host.current) return;
                const svg = lucide.createElement(iconNode);
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.setAttribute('stroke-width', '1.6');
                host.current.replaceChildren(svg);
            }, [name]);
            return <span ref={host} aria-hidden="true" className={`inline-flex shrink-0 ${className}`} style={{ width: size, height: size, ...style }} />;
        };

        // ---------- Editor snippet ----------

        const SNIPPET = [
            'import { readFile } from "fs/promises";',
            '',
            '// Resume a session only when no other process owns it.',
            'export async function resumeSession(id: string, retries = 3): Promise<Session> {',
            '  const transcript = await readFile(transcriptPath(id), "utf8");',
            '  const session: Session = parseTranscript(transcript);',
            '  if (session.isLiveElsewhere) {',
            '    throw new Error(`Session ${id} is live elsewhere`);',
            '  }',
            '  for (let attempt = 0; attempt < retries; attempt++) {',
            '    const terminal = await launchTerminal(session.cwd);',
            '    if (terminal.pid > 0) return { ...session, pid: terminal.pid };',
            '  }',
            '  return session;',
            '}',
            '',
            'const MAX_IDLE_SECONDS = 300;',
            'export type Session = { id: string; cwd: string; pid?: number };',
        ];
        const CONTROL_WORDS = new Set(['import', 'from', 'return', 'if', 'throw', 'for', 'await']);
        const STORAGE_WORDS = new Set(['const', 'let', 'function', 'type']);
        const MODIFIER_WORDS = new Set(['export', 'async']);
        const PRIMITIVES = new Set(['string', 'number', 'boolean']);
        const SIGNATURE_LINE = 3;
        const SIGNATURE_PARAMS = new Set(['id', 'retries']);

        function tokenizeLine(line, lineIndex) {
            const tokens = [];
            let rest = line;
            let previousWord = '';
            const push = (short, text) => { tokens.push([short, text]); rest = rest.slice(text.length); };
            while (rest.length > 0) {
                const consumed = line.length - rest.length;
                const before = line.slice(0, consumed).trimEnd();
                let match;
                if ((match = rest.match(/^\/\/.*/))) push('cmt', match[0]);
                else if ((match = rest.match(/^"[^"]*"/))) push('str', match[0]);
                else if ((match = rest.match(/^`[^`]*`/))) push('tpl', match[0]);
                else if ((match = rest.match(/^\d+/))) push('num', match[0]);
                else if ((match = rest.match(/^[A-Za-z_$][\w$]*/))) {
                    const word = match[0];
                    const after = rest.slice(word.length).trimStart();
                    let short = 'variable';
                    if (CONTROL_WORDS.has(word)) short = 'kw';
                    else if (STORAGE_WORDS.has(word)) short = 'storage';
                    else if (MODIFIER_WORDS.has(word)) short = 'modifier';
                    else if (word === 'new') short = 'newOp';
                    else if (PRIMITIVES.has(word)) short = 'prim';
                    else if (after.startsWith('(')) short = 'fn';
                    else if (before.endsWith('.')) short = 'prop';
                    else if (lineIndex === SIGNATURE_LINE && SIGNATURE_PARAMS.has(word)) short = 'param';
                    else if (/^[A-Z][A-Z0-9_]+$/.test(word)) short = 'cnst';
                    else if (/^[A-Z]/.test(word)) short = 'type';
                    else if ((after.startsWith(':') || after.startsWith('?:')) && previousWord !== 'const' && previousWord !== 'let') short = 'prop';
                    previousWord = word;
                    push(short, word);
                }
                else if ((match = rest.match(/^\s+/))) push(null, match[0]);
                else if ((match = rest.match(/^\.\.\./))) push('op', match[0]);
                else if ((match = rest.match(/^[<>]/))) push(/\w$/.test(line.slice(0, consumed)) ? 'punc' : 'op', match[0]);
                else if ((match = rest.match(/^(\+\+|[=+\-*\/!?])/))) push('op', match[0]);
                else push('punc', rest[0]);
            }
            return tokens;
        }

        const JSX_TOKEN_LINES = [
            [['tagPunc', '<'], ['tag', 'section'], [null, ' '], ['attr', 'className'], ['op', '='], ['str', '"lab"'], ['tagPunc', '>']],
            [[null, '  '], ['tagPunc', '<'], ['tag', 'Badge'], [null, ' '], ['attr', 'tone'], ['op', '='], ['str', '"busy"'], ['tagPunc', '>'], ['punc', '{'], ['variable', 'count'], ['punc', '}'], ['tagPunc', '</'], ['tag', 'Badge'], ['tagPunc', '>']],
            [[null, '  '], ['tagPunc', '<'], ['tag', 'a'], [null, ' '], ['attr', 'href'], ['op', '='], ['punc', '{'], ['variable', 'link'], ['punc', '.'], ['prop', 'url'], ['punc', '}'], ['tagPunc', '>'], [null, 'Open'], ['tagPunc', '</'], ['tag', 'a'], ['tagPunc', '>']],
            [['tagPunc', '</'], ['tag', 'section'], ['tagPunc', '>']],
        ];

        const occurrences = (text, needle) => {
            const found = [];
            for (let index = text.indexOf(needle); index !== -1; index = text.indexOf(needle, index + 1)) found.push(index);
            return found;
        };

        const FIND_TERM = 'session';
        const CURRENT_MATCH_INDEX = 1;
        const CURRENT_LINE = 5;
        const CURSOR_COLUMN = 15;
        const SELECTION = { line: 4, start: 36, end: 54 };
        const BRACKETS = [{ line: 6, column: 31 }, { line: 8, column: 2 }];
        const MODIFIED_LINES = new Set([10, 11]);
        const ADDED_LINES = new Set([16]);
        const DELETED_LINES = new Set([13]);
        const ACTIVE_INDENT_LINES = new Set([7]);
        // The for loop's braces: guide on the lines between them.
        const PAIR_GUIDE = { fromLine: 10, toLine: 11, column: 2, openLine: 9 };
        const SQUIGGLES = [
            { line: 5, text: 'parseTranscript', key: 'editorError.foreground', name: 'Error squiggle' },
            { line: 16, text: 'MAX_IDLE_SECONDS', key: 'editorWarning.foreground', name: 'Warning squiggle' },
        ];
        const LINE_HEIGHT = 18;

        // VS Code's built-in bracket colors, used when a theme leaves editorBracketHighlight.* unset.
        const DEFAULT_BRACKET_COLORS = { dark: ['#FFD700', '#DA70D6', '#179FFF'], light: ['#0431FA', '#319331', '#7B3814'] };
        const OPEN_BRACKETS = '([{';
        const CLOSE_BRACKETS = ')]}';

        // Bracket pair colorization: each bracket gets its nesting depth, carried across lines.
        function withBracketDepths(tokenLines) {
            let depth = 0;
            return tokenLines.map((tokens) => tokens.map(([short, text]) => {
                if (short === 'punc' && OPEN_BRACKETS.includes(text)) return [short, text, depth++];
                if (short === 'punc' && CLOSE_BRACKETS.includes(text)) return [short, text, --depth];
                return [short, text, null];
            }));
        }

        const bracketColorKey = (colors, depth) => {
            const cycle = colors['editorBracketHighlight.foreground4'] ? 6 : 3;
            return { index: (depth % cycle) + 1, cycle };
        };

        const Overlay = ({ column, width, style, keys, name }) => (
            <span {...region(name, keys)} style={{ position: 'absolute', top: 0, bottom: 0, left: `${column}ch`, width: `${width}ch`, ...style }} />
        );

        const Guide = ({ column, color, name, keys }) => (
            <span {...region(name, keys)} style={{ position: 'absolute', left: `${column}ch`, top: 0, bottom: 0, width: 1, background: color }} />
        );

        const CodeView = ({ lines, tokenLines, showDecorations }) => {
            const { tokenStyle, colors, kind } = useContext(MockContext);
            const annotated = withBracketDepths(tokenLines ?? lines.map((line, lineIndex) => tokenizeLine(line, lineIndex)));
            const plainLines = annotated.map((tokens) => tokens.map(([, text]) => text).join(''));
            const defaults = DEFAULT_BRACKET_COLORS[kind];
            const pairDepth = annotated[PAIR_GUIDE.openLine]?.find((token) => token[1] === '{')?.[2] ?? 0;
            const pairKey = `editorBracketPairGuide.activeBackground${bracketColorKey(colors, pairDepth).index}`;
            let findIndex = 0;
            return (
                <div className="wb-mono" style={{ fontSize: 12, lineHeight: `${LINE_HEIGHT}px` }}>
                    {annotated.map((tokens, lineIndex) => {
                        const line = plainLines[lineIndex];
                        const isCurrent = showDecorations && lineIndex === CURRENT_LINE;
                        const matches = showDecorations ? occurrences(line, FIND_TERM) : [];
                        const gutterKey = !showDecorations ? null : MODIFIED_LINES.has(lineIndex) ? 'editorGutter.modifiedBackground' : ADDED_LINES.has(lineIndex) ? 'editorGutter.addedBackground' : DELETED_LINES.has(lineIndex) ? 'editorGutter.deletedBackground' : null;
                        const hasPairGuide = showDecorations && lineIndex >= PAIR_GUIDE.fromLine && lineIndex <= PAIR_GUIDE.toLine;
                        return (
                            <div key={lineIndex} className="flex" style={{ height: LINE_HEIGHT, background: isCurrent ? c('editor.lineHighlightBackground') : undefined }} {...(isCurrent ? region('Current line', ['editor.lineHighlightBackground', 'editor.lineHighlightBorder']) : {})}>
                                <span className="relative shrink-0" style={{ width: 4 }} {...(gutterKey ? region('Gutter change bar', [gutterKey]) : region('Gutter', ['editorGutter.background']))}>
                                    {gutterKey && <span className="absolute left-0" style={{ width: 3, top: 0, height: DELETED_LINES.has(lineIndex) ? 5 : LINE_HEIGHT, background: c(gutterKey) }} />}
                                </span>
                                <span className="text-right pr-4 select-none shrink-0" style={{ width: 44, color: isCurrent ? c('editorLineNumber.activeForeground') : c('editorLineNumber.foreground') }} {...region('Line numbers', ['editorLineNumber.foreground', 'editorLineNumber.activeForeground'])}>{lineIndex + 1}</span>
                                <span className="relative whitespace-pre flex-1 min-w-0" style={{ color: c('editor.foreground') }}>
                                    {/^ {2}/.test(line) && <Guide column={0} name="Indent guide" keys={['editorIndentGuide.background1']} color={c('editorIndentGuide.background1')} />}
                                    {/^ {4}/.test(line) && !hasPairGuide && (
                                        showDecorations && ACTIVE_INDENT_LINES.has(lineIndex)
                                            ? <Guide column={2} name="Active indent guide" keys={['editorIndentGuide.activeBackground1']} color={c('editorIndentGuide.activeBackground1')} />
                                            : <Guide column={2} name="Indent guide" keys={['editorIndentGuide.background1']} color={c('editorIndentGuide.background1')} />
                                    )}
                                    {hasPairGuide && <Guide column={PAIR_GUIDE.column} name="Active bracket pair guide" keys={[pairKey]} color={c(pairKey, c('editorIndentGuide.background1'))} />}
                                    {showDecorations && lineIndex === SELECTION.line && (
                                        <Overlay name="Selection" column={SELECTION.start} width={SELECTION.end - SELECTION.start} keys={['editor.selectionBackground']} style={{ background: c('editor.selectionBackground') }} />
                                    )}
                                    {matches.map((column) => {
                                        const isCurrentMatch = findIndex++ === CURRENT_MATCH_INDEX;
                                        return isCurrentMatch
                                            ? <Overlay key={column} name="Find match" column={column} width={FIND_TERM.length} keys={['editor.findMatchBackground', 'editor.findMatchBorder']} style={{ background: c('editor.findMatchBackground'), outline: `1px solid ${c('editor.findMatchBorder')}`, outlineOffset: -1 }} />
                                            : <Overlay key={column} name="Find match highlight" column={column} width={FIND_TERM.length} keys={['editor.findMatchHighlightBackground']} style={{ background: c('editor.findMatchHighlightBackground') }} />;
                                    })}
                                    {showDecorations && BRACKETS.filter((bracket) => bracket.line === lineIndex).map((bracket) => (
                                        <Overlay key={bracket.column} name="Bracket match" column={bracket.column} width={1} keys={['editorBracketMatch.background', 'editorBracketMatch.border']} style={{ background: c('editorBracketMatch.background'), outline: `1px solid ${c('editorBracketMatch.border')}`, outlineOffset: -1 }} />
                                    ))}
                                    <span className="relative">
                                        {tokens.map(([short, text, depth], tokenIndex) => {
                                            if (depth !== null) {
                                                const { index } = bracketColorKey(colors, depth);
                                                const key = `editorBracketHighlight.foreground${index}`;
                                                return <span key={tokenIndex} {...region(`Bracket depth ${depth + 1}`, [key])} style={{ ...tokenStyle.punc, color: c(key, defaults[index - 1] ?? tokenStyle.punc.color) }}>{text}</span>;
                                            }
                                            const squiggle = showDecorations && SQUIGGLES.find((candidate) => candidate.line === lineIndex && candidate.text === text);
                                            if (squiggle) {
                                                return <span key={tokenIndex} {...region(squiggle.name, [squiggle.key])} style={{ ...tokenStyle[short], textDecoration: `underline wavy ${c(squiggle.key)}`, textDecorationThickness: 1, textUnderlineOffset: 3, textDecorationSkipInk: 'none' }}>{text}</span>;
                                            }
                                            return <span key={tokenIndex} style={short ? tokenStyle[short] : undefined} {...(short ? { 'data-region': `Token: ${SNIPPET_SCOPES[short]}`, 'data-keys': `tok:${short}` } : {})}>{text}</span>;
                                        })}
                                    </span>
                                    {isCurrent && <span {...region('Cursor', ['editorCursor.foreground'])} style={{ position: 'absolute', left: `${CURSOR_COLUMN}ch`, top: 1, bottom: 1, width: 2, background: c('editorCursor.foreground') }} />}
                                </span>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const MINIMAP_LINE = 4;
        const RULER_MARKS = [
            { line: 2, key: 'editorOverviewRuler.findMatchForeground', fallback: 'rgba(209, 134, 22, 0.49)', lane: 'center' },
            { line: 5, key: 'editorOverviewRuler.findMatchForeground', fallback: 'rgba(209, 134, 22, 0.49)', lane: 'center' },
            { line: 13, key: 'editorOverviewRuler.findMatchForeground', fallback: 'rgba(209, 134, 22, 0.49)', lane: 'center' },
            { line: 4, key: 'editorOverviewRuler.selectionHighlightForeground', fallback: 'rgba(160, 160, 160, 0.8)', lane: 'center' },
            { line: 6, key: 'editorOverviewRuler.bracketMatchForeground', fallback: 'rgba(160, 160, 160, 0.8)', lane: 'center' },
            { line: 10, key: 'editorOverviewRuler.modifiedForeground', lane: 'left' },
            { line: 11, key: 'editorOverviewRuler.modifiedForeground', lane: 'left' },
            { line: 16, key: 'editorOverviewRuler.addedForeground', lane: 'left' },
            { line: 13, key: 'editorOverviewRuler.deletedForeground', lane: 'left' },
            { line: 5, key: 'editorOverviewRuler.errorForeground', lane: 'right' },
            { line: 16, key: 'editorOverviewRuler.warningForeground', lane: 'right' },
            { line: 0, key: 'editorOverviewRuler.infoForeground', lane: 'right' },
        ];
        const RULER_LANES = { left: 1, center: 5, right: 9 };

        const Minimap = () => {
            const { tokenStyle } = useContext(MockContext);
            const highlightFor = (lineIndex) => {
                if (lineIndex === 5) return ['minimap.errorHighlight', 'Minimap error'];
                if (lineIndex === 16) return ['minimap.warningHighlight', 'Minimap warning'];
                if (lineIndex === SELECTION.line) return ['minimap.selectionHighlight', 'Minimap selection'];
                if (occurrences(SNIPPET[lineIndex], FIND_TERM).length > 0) return ['minimap.findMatchHighlight', 'Minimap find match'];
                return null;
            };
            return (
                <div {...region('Minimap', ['minimap.background', 'minimapSlider.background'])} className="absolute top-0 bottom-0 overflow-hidden" style={{ right: 14, width: 70, background: c('minimap.background'), zIndex: 1 }}>
                    <div {...region('Minimap slider', ['minimapSlider.background'])} className="absolute left-0 right-0 top-0" style={{ height: 60, background: c('minimapSlider.background', 'rgba(121, 121, 121, 0.2)') }} />
                    {SNIPPET.map((line, lineIndex) => {
                        const highlight = highlightFor(lineIndex);
                        const gutterKey = MODIFIED_LINES.has(lineIndex) ? 'minimapGutter.modifiedBackground' : ADDED_LINES.has(lineIndex) ? 'minimapGutter.addedBackground' : DELETED_LINES.has(lineIndex) ? 'minimapGutter.deletedBackground' : null;
                        let column = 0;
                        return (
                            <div key={lineIndex} {...(highlight ? region(highlight[1], [highlight[0]]) : {})} className="relative" style={{ height: MINIMAP_LINE, marginTop: 1, background: highlight ? c(highlight[0], 'transparent') : 'transparent' }}>
                                {gutterKey && <span {...region('Minimap gutter', [gutterKey])} className="absolute left-0 top-0 bottom-0" style={{ width: 2, background: c(gutterKey) }} />}
                                {tokenizeLine(line, lineIndex).map(([short, text], tokenIndex) => {
                                    const left = 4 + column * 0.9;
                                    column += text.length;
                                    if (!short) return null;
                                    return <span key={tokenIndex} className="absolute" style={{ left, top: 1, height: 2, width: text.length * 0.9, background: tokenStyle[short].color, opacity: 0.7 }} />;
                                })}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const OverviewRuler = () => (
            <div {...region('Overview ruler', ['editorOverviewRuler.border', 'scrollbarSlider.background'])} className="absolute top-0 bottom-0" style={{ right: 0, width: 14, borderLeft: `1px solid ${c('editorOverviewRuler.border')}`, zIndex: 1 }}>
                <span className="absolute left-0 right-0 top-0" style={{ height: 110, background: c('scrollbarSlider.background') }} />
                {RULER_MARKS.map((mark, markIndex) => (
                    <span key={markIndex} {...region('Overview ruler mark', [mark.key])} className="absolute" style={{ left: RULER_LANES[mark.lane], width: 4, top: 4 + mark.line * 14, height: 4, background: c(mark.key, mark.fallback ?? 'transparent') }} />
                ))}
            </div>
        );

        // ---------- Workbench pieces ----------

        const TitleBar = () => (

            );
        };

        const StatusItem = ({ children, name, keys, style }) => (
            <span {...region(name, keys)} className="flex items-center gap-1 px-2 h-full" style={style}>{children}</span>
        );

        const StatusBar = () => (
            <div {...region('Status bar', ['statusBar.background', 'statusBar.foreground', 'statusBar.border'])} className="flex items-center" style={{ height: 22, fontSize: 12, background: c('statusBar.background'), color: c('statusBar.foreground'), borderTop: `1px solid ${c('statusBar.border', 'transparent')}` }}>
                <StatusItem name="Remote item" keys={['statusBarItem.remoteBackground', 'statusBarItem.remoteForeground']} style={{ background: c('statusBarItem.remoteBackground'), color: c('statusBarItem.remoteForeground'), paddingLeft: 10, paddingRight: 10 }}><Icon name="Monitor" size={13} />SSH: devbox</StatusItem>
                <StatusItem name="Status item" keys={['statusBar.foreground']}><Icon name="GitBranch" size={13} />feat/theme-lab</StatusItem>
                <StatusItem name="Error item" keys={['statusBarItem.errorForeground']} style={{ color: c('statusBarItem.errorForeground') }}><Icon name="CircleX" size={13} />1</StatusItem>
                <StatusItem name="Warning item" keys={['statusBarItem.warningForeground']} style={{ color: c('statusBarItem.warningForeground') }}><Icon name="TriangleAlert" size={13} />2</StatusItem>
                <StatusItem name="Overseer workspace item" keys={['statusBar.foreground']}><Icon name="Layers" size={13} />Default</StatusItem>
                <span className="ml-auto flex items-center h-full">
                    <StatusItem name="Hovered status item" keys={['statusBarItem.hoverBackground']} style={{ background: c('statusBarItem.hoverBackground') }}>Ln 6, Col 16</StatusItem>
                    <StatusItem name="Status item" keys={['statusBar.foreground']}>Spaces: 2</StatusItem>
                    <StatusItem name="Status item" keys={['statusBar.foreground']}>UTF-8</StatusItem>
                    <StatusItem name="Status item" keys={['statusBar.foreground']}>TypeScript</StatusItem>
                    <StatusItem name="Status item" keys={['statusBar.foreground']}><Icon name="Bell" size={13} /></StatusItem>
                </span>
            </div>
        );

        const QUICK_PICK_ROWS = [
            { label: 'Refresh window PR', detail: 'Login sprint · web-app', group: 'recently opened' },
            { label: 'Resume all suspended', detail: 'Overseer', group: null },
            { label: 'Export retry backoff', detail: 'Billing export · api', group: 'sessions' },
            { label: 'Flaky e2e triage', detail: 'Ungrouped · web-app', group: null },
            { label: 'Release 0.0.35', detail: 'Ungrouped · djaunt-overseer', group: null },
        ];
        const QUICK_PICK_FOCUSED = 1;
        const QUICK_PICK_TERM = 'Re';

        const QuickPick = () => (
            <div {...region('Quick pick', ['quickInput.background', 'quickInput.foreground', 'widget.border', 'widget.shadow'])} className="absolute rounded-sm overflow-hidden" style={{ top: 36, left: 290, width: 520, background: c('quickInput.background'), color: c('quickInput.foreground'), border: `1px solid ${c('widget.border')}`, zIndex: 5 }}>
                <div {...region('Quick pick title', ['quickInputTitle.background'])} className="text-center" style={{ fontSize: 12, padding: '3px 0', background: c('quickInputTitle.background') }}>Overseer: Resume Session</div>
                <div className="p-1.5">
                    <div {...region('Quick pick input', ['input.background', 'input.foreground', 'focusBorder'])} className="flex items-center px-1.5" style={{ height: 26, background: c('input.background'), color: c('input.foreground'), border: `1px solid ${c('focusBorder')}` }}>{QUICK_PICK_TERM}</div>
                </div>
                <div className="pb-1.5">
                    {QUICK_PICK_ROWS.map((row, rowIndex) => {
                        const isFocused = rowIndex === QUICK_PICK_FOCUSED;
                        const highlightKey = isFocused ? 'list.focusHighlightForeground' : 'list.highlightForeground';
                        return (
                            <div key={row.label} {...(isFocused ? region('Quick pick focused row', ['quickInputList.focusBackground', 'list.focusHighlightForeground', 'list.activeSelectionForeground']) : region('Quick pick row', ['list.highlightForeground', 'descriptionForeground', 'pickerGroup.foreground', 'pickerGroup.border']))}
                                 className="flex items-center gap-2 px-3" style={{ height: 24, background: isFocused ? c('quickInputList.focusBackground') : 'transparent', borderTop: row.group && rowIndex > 0 ? `1px solid ${c('pickerGroup.border')}` : 'none' }}>
                                <Icon name="Layers" size={14} />
                                <span><span style={{ color: c(highlightKey), fontWeight: 600 }}>{row.label.slice(0, 2)}</span>{row.label.slice(2)}</span>
                                <span style={{ fontSize: 11, color: isFocused ? 'inherit' : c('descriptionForeground'), opacity: isFocused ? 0.8 : 1 }}>{row.detail}</span>
                                {row.group && <span className="ml-auto" style={{ fontSize: 11, color: c('pickerGroup.foreground') }}>{row.group}</span>}
                            </div>
                        );
                    })}
                </div>
            </div>
        );

        const MENU_ITEMS = ['Resume', 'Rename…', 'Fork', null, 'Move to Group', 'Suspend', null, 'Remove from Overseer'];
        const MENU_SELECTED = 'Fork';

        const ContextMenu = () => (
            <div {...region('Context menu', ['menu.background', 'menu.foreground', 'menu.border', 'menu.separatorBackground'])} className="absolute rounded-sm py-1" style={{ top: 250, left: 200, width: 190, background: c('menu.background'), color: c('menu.foreground'), border: `1px solid ${c('menu.border')}`, zIndex: 4, fontSize: 12 }}>
                {MENU_ITEMS.map((item, itemIndex) => item === null
                    ? <div key={itemIndex} style={{ height: 1, margin: '4px 0', background: c('menu.separatorBackground') }} />
                    : (
                        <div key={item} {...(item === MENU_SELECTED ? region('Menu selected item', ['menu.selectionBackground', 'menu.selectionForeground']) : {})} className="px-5 mx-1 rounded-sm" style={{ height: 22, lineHeight: '22px', background: item === MENU_SELECTED ? c('menu.selectionBackground') : 'transparent', color: item === MENU_SELECTED ? c('menu.selectionForeground') : 'inherit' }}>{item}</div>
                    ))}
            </div>
        );

        const Toast = () => (
            <div {...region('Notification toast', ['notifications.background', 'notifications.foreground', 'notificationToast.border', 'notificationsInfoIcon.foreground'])} className="absolute rounded-sm p-2.5" style={{ right: 12, bottom: 34, width: 340, background: c('notifications.background'), color: c('notifications.foreground'), border: `1px solid ${c('notificationToast.border')}`, zIndex: 3, fontSize: 12 }}>
                <div className="flex gap-2">
                    <span {...region('Info icon', ['notificationsInfoIcon.foreground'])} className="inline-flex" style={{ color: c('notificationsInfoIcon.foreground') }}><Icon name="Info" size={16} /></span>
                    <span className="flex-1">Overseer: no statuses set up yet. <span {...region('Link', ['textLink.foreground'])} style={{ color: c('textLink.foreground') }}>Learn more</span></span>
                    <Icon name="X" size={14} />
                </div>
                <div className="flex justify-end gap-2 mt-2.5">
                    <span {...region('Secondary button', ['button.secondaryBackground', 'button.secondaryForeground'])} className="px-3 rounded-sm" style={{ lineHeight: '24px', background: c('button.secondaryBackground'), color: c('button.secondaryForeground') }}>Later</span>
                    <span {...region('Primary button', ['button.background', 'button.foreground', 'button.border'])} className="px-3 rounded-sm" style={{ lineHeight: '24px', background: c('button.background'), color: c('button.foreground'), border: `1px solid ${c('button.border', 'transparent')}` }}>Open Settings</span>
                </div>
            </div>
        );

        const Workbench = ({ built, mode, focus, showOverlays, onHover }) => {
            const variables = useMemo(() => themeVariables(built), [built]);
            const context = useMemo(() => ({ tokenStyle: tokenStyles(built), colors: built.colors, kind: built.palette.kind, focus, mode }), [built, focus, mode]);
            const onMouseMove = (event) => {
                const target = event.target.closest('[data-keys]');
                if (!target) { onHover(null); return; }
                onHover({ x: event.clientX, y: event.clientY, name: target.dataset.region, keys: target.dataset.keys.split(','), built, mode });
            };
            return (
                <MockContext.Provider value={context}>
                    <div className="wb relative flex flex-col overflow-hidden" style={{ ...variables, width: MOCK_WIDTH, height: MOCK_HEIGHT, background: c('editor.background'), color: c('foreground') }} onMouseMove={onMouseMove} onMouseLeave={() => onHover(null)}>
                        <TitleBar />
                        <div className="flex flex-1 min-h-0">
                            <ActivityBar />
                            <SideBar />
                            <div className="flex flex-col flex-1 min-w-0">
                                <div className="flex flex-1 min-h-0"><EditorGroupOne /><EditorGroupTwo /></div>
                                <Panel />
                            </div>
                        </div>
                        <StatusBar />
                        <Toast />
                        {showOverlays && <QuickPick />}
                        {showOverlays && <ContextMenu />}
                    </div>
                </MockContext.Provider>
            );
        };

        // ---------- Page chrome ----------

        const ScaledMock = ({ children }) => {
            const host = useRef(null);
            const [width, setWidth] = useState(MOCK_WIDTH);
            useLayoutEffect(() => {
                const observer = new ResizeObserver(([entry]) => setWidth(entry.contentRect.width));
                observer.observe(host.current);
                return () => observer.disconnect();
            }, []);
            const scale = Math.min(1, width / MOCK_WIDTH);
            return (
                <div ref={host} className="w-full" style={{ height: MOCK_HEIGHT * scale }}>
                    <div style={{ width: MOCK_WIDTH, height: MOCK_HEIGHT, transform: `scale(${scale})`, transformOrigin: '0 0' }} className="border border-line">{children}</div>
                </div>
            );
        };

        const readControls = () => {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {}; } catch { return {}; }
        };

        const Segmented = ({ label, value, options, onChange }) => (
            <div className="flex flex-col gap-1">
                <span className="text-[11px] uppercase tracking-label text-muted">{label}</span>
                <div className="flex border border-line rounded-sm overflow-hidden">
                    {options.map((option) => (
                        <button key={option.value} onClick={() => onChange(option.value)}
                                className={`flex items-center gap-1.5 px-3 h-8 text-sm border-r border-line last:border-r-0 transition-colors ${value === option.value ? 'bg-accent text-on-accent' : 'bg-surface text-bone hover:bg-raised'}`}>
                            {option.icon && <Icon name={option.icon} size={14} />}{option.label}
                        </button>
                    ))}
                </div>
            </div>
        );

        const HoverCard = ({ hover }) => {
            if (!hover) return null;
            const left = Math.min(hover.x + 14, window.innerWidth - 380);
            const top = Math.min(hover.y + 14, window.innerHeight - 40 - hover.keys.length * 22);
            return (
                <div className="fixed z-50 pointer-events-none bg-raised border border-line rounded-sm px-3 py-2 text-xs" style={{ left, top, width: 360 }}>
                    <div className="font-display text-sm mb-1">{hover.name} <span className="text-muted font-sans">· {hover.mode}</span></div>
                    {hover.keys.map((colorKey) => {
                        if (colorKey.startsWith('tok:')) {
                            const scope = SNIPPET_SCOPES[colorKey.slice(4)];
                            const match = resolveScope(hover.built.tokenColors, scope);
                            return (
                                <div key={colorKey} className="flex items-center gap-2 font-mono leading-5">
                                    <span className="w-3 h-3 border border-line" style={{ background: match?.settings?.foreground }} />
                                    <span className="flex-1 truncate">{match ? `${match.rule} (${match.selector})` : 'no rule'}</span>
                                    <span className="text-muted">{match?.settings?.foreground}{match?.settings?.fontStyle ? ` ${match.settings.fontStyle}` : ''}</span>
                                </div>
                            );
                        }
                        const hex = hover.built.colors[colorKey];
                        return (
                            <div key={colorKey} className="flex items-center gap-2 font-mono leading-5">
                                <span className="w-3 h-3 border border-line" style={{ background: hex ?? 'transparent' }} />
                                <span className="flex-1 truncate">{colorKey}</span>
                                <span className="text-muted">{hex ?? (colorKey.includes('*') ? '16 keys' : 'unset')}</span>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const MODE_IDS = LAB ? LAB.modes.map((mode) => mode.id) : [];
        const modeLabel = (modeId) => LAB.modes.find((mode) => mode.id === modeId)?.label ?? modeId;
        const validMode = (modeId, fallback) => (MODE_IDS.includes(modeId) ? modeId : fallback);

        const MockCard = ({ themeId, mode, focus, showOverlays, onHover }) => {
            const variant = LAB.variants[themeId];
            return (
                <div className="flex flex-col gap-2 min-w-0">
                    <div className="flex items-center gap-2 text-sm">
                        <span className="font-display">{variant.label}</span>
                        <span className={`px-1.5 rounded-sm border text-[11px] uppercase tracking-label ${mode !== 'current' ? 'border-accent text-accent' : 'border-line text-muted'}`}>{modeLabel(mode)}</span>
                        <span className="ml-auto text-muted text-xs font-mono">lowest pair {variant[mode].contrast.lowestPair.ratio}:1</span>
                    </div>
                    <ScaledMock><Workbench built={variant[mode]} mode={modeLabel(mode)} focus={focus} showOverlays={showOverlays} onHover={onHover} /></ScaledMock>
                </div>
            );
        };

        const Swatch = ({ hex }) => (
            <span className="inline-flex items-center gap-1.5 font-mono">
                <span className="w-3 h-3 border border-line inline-block" style={{ background: typeof hex === 'string' ? hex : 'transparent' }} />{hex === undefined ? 'unset' : Array.isArray(hex) ? `${hex.length} hues` : typeof hex === 'object' ? `${Object.keys(hex).length} surfaces` : hex}
            </span>
        );

        const ChangeList = ({ themeId, fromMode, toMode }) => {
            const variant = LAB.variants[themeId];
            const from = variant[fromMode];
            const to = variant[toMode];
            const paletteKeys = [...new Set([...Object.keys(from.palette), ...Object.keys(to.palette)])]
                .filter((key) => JSON.stringify(from.palette[key]) !== JSON.stringify(to.palette[key]));
            const colorKeys = [...new Set([...Object.keys(from.colors), ...Object.keys(to.colors)])]
                .filter((key) => from.colors[key] !== to.colors[key]).sort();
            const failures = [fromMode, toMode].filter((modeId, index, all) => all.indexOf(modeId) === index)
                .flatMap((modeId) => variant[modeId].contrast.failures.map((failure) => `${modeLabel(modeId)} · ${failure}`));
            return (
                <details className="border border-line rounded-sm bg-surface">
                    <summary className="cursor-pointer px-4 py-2 text-sm flex items-center gap-2">
                        <Icon name="Palette" size={14} />
                        <span className="font-display">{variant.label}</span>
                        <span className="text-muted">{modeLabel(fromMode)} to {modeLabel(toMode)}: {paletteKeys.length} palette keys and {colorKeys.length} color keys change</span>
                        <span className={`ml-auto text-xs ${failures.length ? 'text-danger' : 'text-success'}`}>{failures.length ? `${failures.length} contrast failures` : `all text ≥ ${LAB.minTextContrast}:1`}</span>
                    </summary>
                    <div className="px-4 pb-4 grid gap-4 md:grid-cols-[1fr_2fr] text-xs">
                        <div>
                            <div className="uppercase tracking-label text-muted mb-1">Palette</div>
                            {paletteKeys.map((key) => (
                                <div key={key} className="flex items-center gap-2 leading-6"><span className="w-28 font-mono">{key}</span><Swatch hex={from.palette[key]} /><Icon name="ChevronRight" size={12} /><Swatch hex={to.palette[key]} /></div>
                            ))}
                        </div>
                        <div>
                            <div className="uppercase tracking-label text-muted mb-1">Color keys</div>
                            <div className="columns-1 xl:columns-2 gap-6">
                                {colorKeys.map((key) => (
                                    <div key={key} className="flex items-center gap-2 leading-6 break-inside-avoid"><span className="flex-1 truncate font-mono">{key}</span><Swatch hex={from.colors[key]} /><Icon name="ChevronRight" size={12} /><Swatch hex={to.colors[key]} /></div>
                                ))}
                            </div>
                        </div>
                        {failures.length > 0 && <div className="md:col-span-2 text-danger font-mono">{failures.map((failure) => <div key={failure}>{failure}</div>)}</div>}
                    </div>
                </details>
            );
        };

        const App = () => {
            const saved = readControls();
            const lastModeId = MODE_IDS[MODE_IDS.length - 1];
            const [themeChoice, setThemeChoice] = useState(saved.themeChoice ?? 'hoard');
            const [mode, setMode] = useState(saved.mode === 'split' ? 'split' : validMode(saved.mode, 'split'));
            const [splitLeft, setSplitLeft] = useState(validMode(saved.splitLeft, 'current'));
            const [splitRight, setSplitRight] = useState(validMode(saved.splitRight, lastModeId));
            const [focus, setFocus] = useState(saved.focus ?? 'sidebar');
            const [showOverlays, setShowOverlays] = useState(saved.showOverlays ?? true);
            const [hover, setHover] = useState(null);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ themeChoice, mode, splitLeft, splitRight, focus, showOverlays })); } catch {}
            }, [themeChoice, mode, splitLeft, splitRight, focus, showOverlays]);

            const isSplit = mode === 'split';
            const themeIds = themeChoice === 'all' ? THEME_IDS : [themeChoice];
            const modes = isSplit ? [splitLeft, splitRight] : [mode];
            const cards = themeIds.flatMap((themeId) => modes.map((cardMode, index) => ({ themeId, cardMode, index })));
            const columns = isSplit || themeChoice === 'all' ? 'lg:grid-cols-2' : '';
            const [fromMode, toMode] = isSplit ? [splitLeft, splitRight] : ['current', mode === 'current' ? lastModeId : mode];
            const modeOptions = LAB.modes.map((labMode) => ({ value: labMode.id, label: labMode.label }));

            return (
                <div className="px-4 md:px-8 py-6 flex flex-col gap-6 max-w-[2400px] mx-auto">
                    <header className="flex flex-wrap items-end gap-x-8 gap-y-4">
                        <div className="flex flex-col gap-1 mr-auto">
                            <span className="text-[11px] uppercase tracking-label text-accent">Overseer · dev only</span>
                            <h1 className="font-display text-3xl tracking-display">Theme Lab</h1>
                            <span className="text-sm text-muted">Edit <code className="font-mono text-bone">scripts/themeLabProposal.mjs</code>, run <code className="font-mono text-bone">npm run theme-lab</code>, reload. Hover any region for its VS Code keys. Built {new Date(LAB.generatedAt).toLocaleString()} · surface step {LAB.surfaceStep} · surface chroma {LAB.surfaceChroma}</span>
                        </div>
                        <Segmented label="Theme" value={themeChoice} onChange={setThemeChoice}
                                   options={[...THEME_IDS.map((themeId) => ({ value: themeId, label: LAB.variants[themeId].label.replace('Overseer ', '') })), { value: 'all', label: 'All', icon: 'LayoutGrid' }]} />
                        <Segmented label="Mode" value={mode} onChange={setMode}
                                   options={[...modeOptions, { value: 'split', label: 'Split', icon: 'Columns2' }]} />
                        {isSplit && <Segmented label="Left" value={splitLeft} onChange={setSplitLeft} options={modeOptions} />}
                        {isSplit && <Segmented label="Right" value={splitRight} onChange={setSplitRight} options={modeOptions} />}
                        <Segmented label="Focus" value={focus} onChange={setFocus}
                                   options={[{ value: 'sidebar', label: 'Sidebar', icon: 'Layers' }, { value: 'terminal', label: 'Terminal', icon: 'SquareTerminal' }]} />
                        <Segmented label="Overlays" value={showOverlays ? 'on' : 'off'} onChange={(value) => setShowOverlays(value === 'on')}
                                   options={[{ value: 'on', label: 'On', icon: 'Eye' }, { value: 'off', label: 'Off', icon: 'EyeOff' }]} />
                    </header>

                    <main className={`grid grid-cols-1 gap-6 ${columns}`}>
                        {cards.map(({ themeId, cardMode, index }) => (
                            <MockCard key={`${themeId}-${index}-${cardMode}`} themeId={themeId} mode={cardMode} focus={focus} showOverlays={showOverlays} onHover={setHover} />
                        ))}
                    </main>

                    <section className="flex flex-col gap-2">
                        <h2 className="font-display text-lg">Changes</h2>
                        {themeIds.map((themeId) => <ChangeList key={themeId} themeId={themeId} fromMode={fromMode} toMode={toMode} />)}
                    </section>

                    <HoverCard hover={hover} />
                </div>
            );
        };

        const MissingData = () => (
            <div className="p-8 max-w-xl">
                <h1 className="font-display text-2xl mb-2">Theme Lab</h1>
                <p className="text-muted">No lab data. Run <code className="font-mono text-bone">npm run theme-lab</code> from the repo root, then reload.</p>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(LAB ? <App /> : <MissingData />);
    </script>
</body>
</html>
